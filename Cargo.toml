[package]
name = "email-alert-cli"
version = "0.1.0"
edition = "2021"
description = "Dev/CI: HMAC POST to Cloudflare email-alerts Worker. 1Password op:// refs. Consumer: centexmsp/repository-restructuring."
license = "MIT OR Apache-2.0"
repository = "https://github.com/centexmsp/email-alert-cli"
readme = "README.md"
default-run = "email-alert"

[lib]
name = "email_alert"
path = "src/lib.rs"

[[bin]]
name = "email-alert"
path = "src/main.rs"

[dependencies]
# SC-HMAC-EA: dedicated shared module (pinned full rev). Private git + git-fetch-with-cli.
email-alert-hmac-v1 = { git = "https://github.com/centexmsp/email-alert-hmac-v1", rev = "7f9ac51107e7331de4c6ee14d6a27f0f2f27736d" }
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
serde_json = "1.0"

[lints.rust]
unused_must_use = "deny"
