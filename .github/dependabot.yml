version: 2
# FREEZE 2026-07-30: open-pull-requests-limit 0 — Dependabot thrash burns
# Actions minutes; API cannot disable dynamic Dependabot (422).
# Restore limits only after ACTIONS_HOSTED_MODE=all + billing trust.
# SSOT: https://github.com/centexmsp/repository-restructuring/blob/main/docs/GITHUB_ACTIONS_USAGE_AND_OFFLOAD_AUDIT_SSOT.md
updates:
  - package-ecosystem: "github-actions"
    open-pull-requests-limit: 0
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "America/Chicago"
    labels:
      - "dependencies"
      - "security"
      - "github-actions"

  - package-ecosystem: "cargo"
    open-pull-requests-limit: 0
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:30"
      timezone: "America/Chicago"
    labels:
      - "dependencies"
      - "security"
      - "rust"
